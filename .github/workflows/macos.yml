# Builds Kickline.app + Kickline-<version>.dmg on GitHub's Mac runners.
# Runs on every push to main (or "Run workflow" in the Actions tab, where you
# can pick an Intel Mac if GitHub's Apple-silicon Macs are busy).
# The .dmg appears under the run's "Artifacts" and on the Releases page,
# tagged with the version from Cargo.toml.
name: macOS build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac to build on (macos-15-intel when Apple-silicon Macs are busy; both make the same universal app)"
        default: macos-latest
        type: choice
        options: [macos-latest, macos-15-intel]
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only changes don't need a new Mac build.
    paths-ignore: ["README.md", "docs/**", "ROADMAP.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Timer accuracy on this runner
        run: cargo test -p lumen-app --locked timer_accuracy -- --ignored --nocapture
      - name: Test
        # A failing test stops the release: nothing broken gets published.
        run: cargo test --workspace --locked
      - name: Build app and disk image
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: ./scripts/build-macos.sh
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: Kickline-macOS
          path: dist/Kickline-*.dmg
      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kickline ${{ steps.ver.outputs.version }}
          files: dist/Kickline-*.dmg
          generate_release_notes: true
          overwrite_files: true
