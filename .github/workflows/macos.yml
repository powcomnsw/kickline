# Builds Lumen.app + Lumen-<version>.dmg on GitHub's Mac runners.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.3.0.
# The .dmg appears under the run's "Artifacts", and for tags on the Releases page.
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build app and disk image
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: ./scripts/build-macos.sh
      - name: Upload build log artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-macOS
          path: dist/Lumen-*.dmg
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lumen-*.dmg
          generate_release_notes: true
