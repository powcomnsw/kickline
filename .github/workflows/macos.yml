# Builds Lumen.app + Lumen-<version>.dmg on GitHub's Mac runners.
# Runs on every push to main (or "Run workflow" in the Actions tab).
# The .dmg appears under the run's "Artifacts" and on the Releases page,
# tagged with the version from Cargo.toml.
name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build app and disk image
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: ./scripts/build-macos.sh
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-macOS
          path: dist/Lumen-*.dmg
      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lumen ${{ steps.ver.outputs.version }}
          files: dist/Lumen-*.dmg
          generate_release_notes: true
          overwrite_files: true
