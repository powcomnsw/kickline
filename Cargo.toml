[workspace]
resolver = "2"
members = ["crates/lumen-core", "crates/lumen-fixtures", "crates/lumen-output", "crates/lumen-audio", "crates/lumen-app"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
